<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Инструменты для ремонта и стройки — структура каталога V18</title>
  <style>:root {
  --orange: #f47b20;
  --orange-dark: #d9610b;
  --ink: #24272b;
  --muted: #6c737c;
  --line: #e1e4e7;
  --surface: #f5f6f7;
  --white: #fff;
}

* { box-sizing: border-box; }
html { background: var(--surface); color: var(--ink); }
body { margin: 0; background: var(--surface); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.loading-card { max-width: 760px; margin: 80px auto; padding: 30px; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
.loading-card h1 { margin-top: 0; }
.site-frame { min-height: 100vh; }

.site-header { position: sticky; top: 0; z-index: 50; border-top: 4px solid var(--orange); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.97); backdrop-filter: blur(12px); }
.header-shell { max-width: 1480px; height: 76px; margin: 0 auto; padding: 0 28px; display: flex; align-items: center; gap: 18px; }
.brand { min-width: 245px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; }
.brand-symbol { width: 56px; height: 34px; border-radius: 6px; background: var(--orange); color: #fff; display: grid; place-items: center; font-size: 16px; font-weight: 900; transform: skew(-6deg); }
.brand > span:last-child { display: flex; flex-direction: column; gap: 2px; }
.brand strong { font-size: 16px; }
.brand small { color: var(--muted); font-size: 12px; }
.catalog-button { height: 42px; padding: 0 17px; border: 0; border-radius: 8px; background: var(--orange); color: #fff; display: flex; align-items: center; gap: 9px; font-weight: 800; }
.catalog-button.active { background: var(--orange-dark); }
.catalog-button i, .catalog-button i::before, .catalog-button i::after { width: 16px; height: 2px; display: block; border-radius: 2px; background: #fff; content: ""; }
.catalog-button i { position: relative; }
.catalog-button i::before { position: absolute; top: -5px; }
.catalog-button i::after { position: absolute; top: 5px; }
.catalog-button > span { font-size: 18px; transition: transform .18s ease; }
.catalog-button.active > span { transform: rotate(180deg); }
.search-wrap { position: relative; flex: 1; max-width: 680px; }
.search-wrap > svg { position: absolute; left: 15px; top: 11px; width: 20px; fill: none; stroke: #848b93; stroke-width: 1.8; z-index: 2; }
.search-wrap input { width: 100%; height: 42px; padding: 0 16px 0 44px; border: 1px solid #d8dce0; border-radius: 9px; outline: none; background: #f7f8f8; }
.search-wrap input:focus { border-color: var(--orange); background: #fff; box-shadow: 0 0 0 3px rgba(244,123,32,.12); }
.search-results { position: absolute; left: 0; right: 0; top: 49px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: 0 18px 42px rgba(34,38,43,.17); max-height: 480px; overflow: auto; }
.search-results button { width: 100%; padding: 11px 12px; border: 0; border-radius: 8px; background: #fff; display: flex; justify-content: space-between; gap: 12px; text-align: left; }
.search-results button:hover { background: #fff1e6; }
.search-results strong { font-size: 13px; }
.search-results small { color: var(--muted); font-size: 11px; white-space: nowrap; }
.search-results p { margin: 0; padding: 12px; color: var(--muted); }
.tree-button { margin-left: auto; height: 42px; padding: 0 16px; border: 1px solid #d8dce0; border-radius: 9px; background: #fff; font-weight: 800; white-space: nowrap; }
.tree-button:hover { border-color: var(--orange); color: var(--orange-dark); }

.page-shell { max-width: 1360px; min-height: calc(100vh - 150px); margin: 0 auto; padding: 23px 28px 80px; }
.breadcrumbs { min-height: 25px; display: flex; align-items: center; gap: 8px; color: #828991; font-size: 13px; }
.breadcrumbs button { padding: 2px 0; border: 0; background: transparent; }
.breadcrumbs button:hover { color: var(--orange-dark); }
.breadcrumbs i { font-style: normal; }
.page-intro { padding: 32px 0 24px; }
.page-intro h1 { max-width: 1100px; margin: 0; font-size: clamp(34px, 4vw, 50px); line-height: 1.05; letter-spacing: -1.6px; }

.entry-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.type-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.group-photo-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.type-direction-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.stage-work-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.brand-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.platform-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.stage-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.popular-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }

.photo-card { position: relative; min-width: 0; min-height: 118px; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); display: flex; align-items: center; overflow: hidden; text-align: left; text-decoration: none; box-shadow: 0 2px 5px rgba(34,38,43,.04); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
.photo-card:hover { transform: translateY(-3px); border-color: #ffb983; box-shadow: 0 14px 30px rgba(34,38,43,.12); color: var(--ink); }
.photo-card.has-image { padding: 0; flex-direction: column; align-items: stretch; background: #fff; }
.photo-card-media { width: 100%; aspect-ratio: 3 / 2; background: #fff; display: block; overflow: hidden; }
.photo-card-media img { width: 100%; height: 100%; display: block; object-fit: cover; }
.photo-card.has-image .photo-card-copy { flex: 1; padding: 15px 18px 17px; }
.photo-card-copy { width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 7px; }
.photo-card-copy strong { font-size: 15px; line-height: 1.3; }
.photo-card-copy small { color: var(--muted); font-size: 11px; line-height: 1.25; }
.entry-card { min-height: 152px; padding: 24px; text-align: center; }
.entry-card .photo-card-copy { align-items: center; }
.entry-card .photo-card-copy strong { font-size: 19px; }
.entry-card.has-image { min-height: 0; text-align: left; }
.entry-card.has-image .photo-card-copy { align-items: flex-start; }
.entry-card.has-image .photo-card-copy strong { font-size: 16px; }
.type-grid .photo-card, .type-direction-grid .photo-card, .brand-grid .photo-card { min-height: 126px; }
.platform-grid .photo-card, .stage-grid .photo-card, .stage-work-grid .photo-card { min-height: 138px; }
.platform-grid .photo-card-copy, .stage-grid .photo-card-copy, .stage-work-grid .photo-card-copy { padding-top: 34px; }
.stage-grid .photo-card.has-image .photo-card-copy, .stage-work-grid .photo-card.has-image .photo-card-copy { padding-top: 15px; }
.stage-badge, .mapping-badge, .voltage-badge { position: absolute; left: 14px; top: 14px; min-width: 34px; height: 27px; padding: 0 8px; border-radius: 7px; background: rgba(244,123,32,.95); color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 900; }
.voltage-badge { background: #33383d; min-width: 56px; font-size: 11px; letter-spacing: .03em; text-transform: uppercase; }
.mapping-badge.warning { background: #7b838d; }

.metrics { margin-top: 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; }
.metrics article { min-height: 92px; padding: 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; }
.metrics article:last-child { border-right: 0; }
.metrics strong { font-size: 25px; }
.metrics span { margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.3; }
.metrics .warning strong { color: #a45316; }
.section-block { margin-top: 52px; }
.section-heading h2 { margin: 0 0 18px; font-size: 27px; }
.popular-card { min-width: 0; min-height: 176px; padding: 19px; border: 1px solid var(--line); border-radius: 11px; background: #fff; box-shadow: 0 2px 5px rgba(34,38,43,.035); }
.popular-card-title { max-width: 100%; margin: 0 0 12px; padding: 0; border: 0; background: transparent; font-size: 14px; font-weight: 900; line-height: 1.25; text-align: left; }
.popular-card-title:hover { color: var(--orange-dark); }
.popular-card > div { display: flex; flex-direction: column; align-items: flex-start; gap: 9px; }
.popular-card a { max-width: 100%; overflow: hidden; color: #515860; font-size: 12px; line-height: 1.25; text-decoration: none; text-overflow: ellipsis; white-space: nowrap; }
.popular-card a:hover { color: var(--orange-dark); text-decoration: underline; }

.mapping-warning { max-width: 880px; padding: 22px; border: 1px solid #e7c7aa; border-radius: 12px; background: #fff7ef; display: flex; flex-direction: column; gap: 8px; }
.mapping-warning strong { color: #9c4a0e; }
.mapping-warning span { color: #6b5b50; font-size: 14px; line-height: 1.45; }

.work-stack { display: grid; gap: 15px; }
.work-stack > details { border: 1px solid var(--line); border-radius: 13px; background: #fff; overflow: hidden; }
.work-stack > details > summary { min-height: 70px; padding: 16px 20px; list-style: none; display: flex; align-items: center; gap: 13px; cursor: pointer; background: #fafafa; }
.work-stack > details > summary::-webkit-details-marker { display: none; }
.work-stack > details > summary > span { width: 34px; height: 34px; border-radius: 9px; background: var(--orange); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 900; }
.work-stack > details > summary strong { font-size: 17px; }
.work-stack > details > summary small { margin-left: auto; color: var(--muted); }
.operation-stack { padding: 18px; display: grid; gap: 22px; }
.operation-stack article { padding-top: 4px; }
.operation-stack h3 { margin: 0 0 13px; font-size: 15px; }

.mega-overlay { position: fixed; inset: 80px 0 0; z-index: 45; padding: 0 22px 22px; background: rgba(26,29,32,.42); }
.mega-panel { max-width: 1480px; height: min(790px, calc(100vh - 100px)); margin: 0 auto; border-radius: 0 0 14px 14px; background: #fff; display: grid; grid-template-columns: 245px minmax(0, 1fr); overflow: hidden; box-shadow: 0 24px 60px rgba(20,24,28,.24); }
.mega-panel > aside { padding: 21px 13px; border-right: 1px solid var(--line); background: #f7f8f8; }
.mega-panel > aside > span { display: block; padding: 0 11px 12px; color: #8a9199; font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
.mega-panel > aside button { width: 100%; min-height: 56px; padding: 12px; border: 0; border-radius: 9px; background: transparent; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; text-align: left; }
.mega-panel > aside button:hover, .mega-panel > aside button.active { background: #fff0e4; color: var(--orange-dark); }
.mega-panel > aside strong { font-size: 13px; line-height: 1.25; }
.mega-panel > aside small { color: #858c94; font-size: 11px; }
.mega-main { padding: 24px 28px 45px; overflow: auto; }
.mega-main > header { padding-bottom: 18px; margin-bottom: 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; }
.mega-main h2 { margin: 4px 0 0; font-size: 25px; }
.mega-main > header > b { color: var(--orange-dark); font-size: 13px; }
.mega-catalog-content { display: grid; gap: 32px; }
.mega-macro { padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.mega-macro-title { margin-bottom: 16px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 900; }
.mega-macro-title:hover { color: var(--orange-dark); }
.mega-macro > div { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 23px 28px; align-items: start; }
.mega-macro article { min-width: 0; }
.mega-group-title { padding: 0 0 8px; border: 0; background: transparent; text-align: left; font-size: 12px; font-weight: 900; }
.mega-group-title:hover { color: var(--orange-dark); }
.mega-macro article > div { display: flex; flex-direction: column; align-items: flex-start; }
.mega-macro article > div button { padding: 3px 0; border: 0; background: transparent; color: #686f77; font-size: 11px; line-height: 1.3; text-align: left; }
.mega-macro article > div button:hover { color: var(--orange-dark); text-decoration: underline; }
.mega-macro article > div small { min-width: 17px; height: 17px; margin-left: 4px; padding: 0 4px; border-radius: 5px; background: #fff0e4; color: var(--orange-dark); display: inline-grid; place-items: center; font-size: 9px; }

.tree-overlay { position: fixed; inset: 0; z-index: 90; background: rgba(25,28,31,.58); display: flex; justify-content: flex-end; }
.tree-panel { width: min(760px, 94vw); height: 100%; background: #f6f7f8; display: flex; flex-direction: column; box-shadow: -25px 0 60px rgba(0,0,0,.22); }
.tree-panel > header { padding: 21px 25px; border-bottom: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: space-between; }
.tree-panel h2 { margin: 4px 0 0; }
.tree-panel > header button { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; background: #fff; font-size: 24px; }
.tree-content { padding: 16px 20px 55px; overflow: auto; }
.tree-content > details { margin-bottom: 11px; border: 1px solid var(--line); border-radius: 11px; background: #fff; overflow: hidden; }
.tree-content summary { padding: 12px 14px; list-style: none; display: flex; justify-content: space-between; gap: 14px; cursor: pointer; }
.tree-content summary::-webkit-details-marker { display: none; }
.tree-content > details > summary { padding: 15px; background: #fff8f2; }
.tree-content summary small { color: var(--muted); }
.tree-content details > div { padding: 6px 12px 14px; }
.tree-content details details { border-left: 1px solid #d7dbdf; margin-left: 8px; padding-left: 8px; }
.tree-content ul { margin: 0; padding: 0 0 7px 15px; list-style: none; }
.tree-content li { min-height: 28px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tree-content li button { padding: 4px 0; border: 0; background: transparent; text-align: left; font-size: 12px; }
.tree-content li button:hover { color: var(--orange-dark); }
.tree-content li > span { min-width: 24px; height: 20px; padding: 0 5px; border-radius: 6px; background: #eef0f2; display: grid; place-items: center; color: #5c646c; font-size: 10px; }
.tree-content li > span.warning { background: #fff0e4; color: #9b4a0f; }

footer { min-height: 75px; padding: 16px 28px; background: #2d3034; color: #fff; display: flex; align-items: center; justify-content: center; gap: 22px; }
footer span { color: #b9bec4; font-size: 12px; }
.toast { position: fixed; right: 24px; bottom: 24px; z-index: 110; padding: 13px 17px; border-radius: 10px; background: #2d3034; color: #fff; opacity: 0; transform: translateY(12px); pointer-events: none; transition: .18s ease; }
.toast.show { opacity: 1; transform: translateY(0); }

/* V11: компактные глубокие уровни со значками */
.compact-intro { padding-bottom: 22px; }
.compact-intro h1 { font-size: clamp(32px, 3.5vw, 46px); }
.icon-card-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 13px; align-items: stretch; }
.icon-card { position: relative; min-width: 0; min-height: 112px; padding: 18px 42px 18px 17px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); display: grid; grid-template-columns: 54px minmax(0, 1fr); align-items: center; gap: 14px; text-align: left; text-decoration: none; box-shadow: 0 2px 5px rgba(34,38,43,.035); transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
.icon-card:hover, .icon-card:focus-visible { transform: translateY(-2px); border-color: #ffb983; box-shadow: 0 10px 24px rgba(34,38,43,.1); color: var(--ink); outline: none; }
.icon-card-symbol { width: 54px; height: 54px; border-radius: 14px; background: #fff2e8; color: var(--orange-dark); display: grid; place-items: center; }
.icon-card-symbol svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-card-copy { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.icon-card-copy strong { font-size: 13px; line-height: 1.28; }
.icon-card-copy small { color: var(--muted); font-size: 10px; line-height: 1.25; }
.icon-card-arrow { position: absolute; right: 15px; top: 50%; transform: translateY(-52%); color: #a1a7ae; font-size: 24px; font-weight: 300; }
.icon-status { position: absolute; right: 12px; top: 10px; min-width: 22px; height: 20px; padding: 0 5px; border-radius: 6px; background: #fff0e4; color: var(--orange-dark); display: grid; place-items: center; font-size: 9px; }
.icon-status.warning { background: #eef0f2; color: #6a727a; }
.search-results a { width: 100%; padding: 11px 12px; border-radius: 8px; color: var(--ink); background: #fff; display: flex; justify-content: space-between; gap: 12px; text-align: left; text-decoration: none; }
.search-results a:hover { background: #fff1e6; }
.search-results a strong { font-size: 13px; }
.search-results a small { color: var(--muted); font-size: 11px; white-space: nowrap; }

/* V11: единая вкладка каталога и раскрывающийся следующий уровень */
.mega-panel > aside button { flex-direction: row; align-items: center; justify-content: flex-start; gap: 9px; }
.mega-panel > aside .root-icon { width: 28px; height: 28px; flex: 0 0 auto; border-radius: 8px; background: var(--orange); color: #fff; display: grid; place-items: center; font-size: 15px; }
.mega-main { padding: 22px 25px 26px; overflow: hidden; display: flex; flex-direction: column; }
.mega-main > header { flex: 0 0 auto; margin-bottom: 14px; padding-bottom: 14px; align-items: center; }
.mega-main > header p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
.mega-catalog-layout { min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; overflow: hidden; }
.mega-directory { min-height: 0; padding-right: 8px; overflow-y: auto; scrollbar-width: thin; }
.mega-path-block { padding: 5px 0 19px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.mega-path-block:last-child { margin-bottom: 0; border-bottom: 0; }
.mega-path-title { margin-bottom: 11px; padding: 0; border: 0; background: transparent; display: inline-flex; align-items: center; gap: 10px; text-align: left; }
.mega-path-title:hover strong { color: var(--orange-dark); }
.mega-path-title > span:last-child { display: flex; flex-direction: column; gap: 2px; }
.mega-path-title strong { font-size: 15px; line-height: 1.2; }
.mega-path-title small { color: var(--muted); font-size: 10px; }
.mega-path-number { width: 32px; height: 32px; border-radius: 9px; background: #fff0e4; color: var(--orange-dark); display: grid; place-items: center; font-size: 10px; font-weight: 900; }
.mega-level-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 8px; }
.mega-level-list.brands { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.mega-level-list.stages { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.mega-level-item { min-width: 0; min-height: 42px; padding: 7px 8px; border: 0; border-radius: 7px; background: transparent; display: flex; align-items: center; justify-content: space-between; gap: 7px; text-align: left; }
.mega-level-item:hover, .mega-level-item:focus-visible { background: #fff0e4; color: var(--orange-dark); outline: none; }
.mega-level-item > span { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mega-level-item strong { overflow: hidden; text-overflow: ellipsis; font-size: 11px; line-height: 1.22; }
.mega-level-item small { color: #858c94; font-size: 9px; }
.mega-level-item > b { color: #a0a7ae; font-size: 17px; }
.mega-third-panel { min-height: 0; padding: 18px; border: 1px solid #d9dde1; border-radius: 11px; background: #fff; overflow-y: auto; box-shadow: 0 14px 35px rgba(24,29,34,.13); }
.mega-third-panel header { padding-bottom: 14px; margin-bottom: 9px; border-bottom: 1px solid var(--line); }
.mega-third-panel h3 { margin: 5px 0 6px; font-size: 19px; line-height: 1.15; }
.mega-third-panel p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
.mega-third-empty { padding: 28px 10px; }
.mega-third-list { display: flex; flex-direction: column; }
.mega-third-list button { min-height: 48px; padding: 8px 7px; border: 0; border-bottom: 1px solid #eceef0; background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; }
.mega-third-list button:last-child { border-bottom: 0; }
.mega-third-list button:hover, .mega-third-list button:focus-visible { color: var(--orange-dark); outline: none; }
.mega-third-list button > span { display: flex; flex-direction: column; gap: 3px; }
.mega-third-list strong { font-size: 11px; line-height: 1.25; }
.mega-third-list small { color: var(--muted); font-size: 9px; }
.mega-third-list b { color: #9da4ac; font-size: 17px; }

@media (max-width: 1120px) {
  .brand { min-width: auto; }
  .brand > span:last-child { display: none; }
  .type-grid, .type-direction-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .brand-grid, .popular-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .group-photo-grid, .platform-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stage-work-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .metrics article:nth-child(3) { border-right: 0; }
  .metrics article:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
  .mega-macro > div { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .icon-card-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .mega-catalog-layout { grid-template-columns: minmax(0, 1fr) 300px; }

    const name = String(platformName || "");
    const oneBase = name.match(/OneBase(12|20)/i);
    if (oneBase) return `${oneBase[1]} V`;
    const flex = name.match(/(10\.8\/12|18\/54|18\/36)(?:\s*)V?/i);
    if (flex) return `${flex[1]} V`;
    const volts = name.match(/(\d+(?:\.\d+)?)\s*(?:V|Volt)/i);
    if (volts) return `${volts[1]} V`;
    const fallback = name.match(/(?:^|\s)(12|18|20|21|24|36|40|54|60|82)(?:\s|$)/);
    return fallback ? `${fallback[1]} V` : "Li-ion";
  }

  function iconKind(name, context = "") {
    const value = normalize(name);
    if (context === "operation") return "checklist";
    if (context === "subgroup") return "folder";
    if (context === "platform") return "battery";
    if (context === "dns") return "grid";
    if (/защит|безопас|перчат|маск/.test(value)) return "safety";
    if (/измер|размет|уров|контрол|линей|уголь|рулет|дальном|нивел|температур/.test(value)) return "measure";
    if (/аккум|акб|заряд|питан/.test(value)) return "battery";
    if (/сверл|дрел|бур|перфорат|корон/.test(value)) return "drill";
    if (/пил|рез|диск|нож|полот|лобз|ушм|штроб/.test(value)) return "cut";
    if (/шлиф|полир|зачист|поверхност|щет/.test(value)) return "surface";
    if (/свар|пая/.test(value)) return "flame";
    if (/хран|ящик|сумк|мастерск|рабочего места/.test(value)) return "box";
    if (/мойк|пылесос|уборк|очист/.test(value)) return "water";
    return "tool";
  }

  function iconCard({ name, attrs = "", meta = "", badge = "", tag = "button", context = "", className = "" }) {

    const close = tag === "a" ? "</a>" : "</button>";
    const icon = ICONS[iconKind(name, context)] || ICONS.tool;
    return `${open}<span class="icon-card-symbol" aria-hidden="true">${icon}</span><span class="icon-card-copy"><strong>${escapeHtml(name)}</strong>${meta ? `<small>${escapeHtml(meta)}</small>` : ""}</span>${badge}<span class="icon-card-arrow" aria-hidden="true">›</span>${close}`;
  }

    const badge = targets.length === 0 ? '<b class="icon-status warning">Нет ссылки</b>' : targets.length > 1 ? `<b class="icon-status">${targets.length}</b>` : "";

    const platform = brand && platformsForBrand(brand).find((item) => item.name === state.extra);
    if (!brand || !platform) return renderNotFound();
    const leaves = flattenLeaves(platform).filter(Boolean);
    return `${breadcrumbs([{ name: "Каталог", kind: "home" }, { name: "Аккумуляторные платформы", kind: "platforms" }, { name: brandSectionName(brand), kind: "brand", id: brand.id }, { name: platform.name }])}
      <section class="page-intro compact-intro"><h1>${escapeHtml(platform.name)}</h1></section>
      <section class="icon-card-grid">${leaves.map((leaf) => {
        const category = dnsCategoryByUrl.get(leaf.url);
        if (category) return dnsCategoryIconCard(category);
        return iconCard({ name: leaf.name, meta: "Категория платформы", context: "platform", tag: "a", attrs: `href="${escapeHtml(leaf.url || "#")}" target="_blank" rel="noopener"` });
      }).join("")}</section>`;
  }

  function renderStages() {
    return `${breadcrumbs([{ name: "Каталог", kind: "home" }, { name: "Подбор по этапам работ" }])}
      <section class="page-intro"><h1>Подбор по этапам работ</h1></section>
      <section class="stage-grid">${visibleStages.map((stage) => catalogCard({ name: stage.name, meta: `${stage.categoryCount} категорий`, image: STAGE_IMAGES.get(stage.name) || "", badge: `<b class="stage-badge">${String(stage.id).padStart(2, "0")}</b>`, attrs: navAttrs("stage", String(stage.id)) })).join("")}</section>`;
  }

  function operationIconCard(stage, workIndex, operationIndex) {
    const operation = stage.works[workIndex].operations[operationIndex];
    return iconCard({ name: operation.name, meta: `${operation.categoryIds.length} категорий`, context: "operation", attrs: navAttrs("operation", String(stage.id), `${workIndex}:${operationIndex}`) });
  }

  function workNavigation(stage, workIndex) {
    const work = stage.works[workIndex];
    return work.operations.length === 1
      ? { kind: "operation", id: String(stage.id), extra: `${workIndex}:0` }
      : { kind: "work", id: String(stage.id), extra: String(workIndex) };
  }

  function renderOperationPage(stage, workIndex, operationIndex) {
    const work = stage?.works?.[workIndex];
    const operation = work?.operations?.[operationIndex];
    if (!stage || !work || !operation) return renderNotFound();
    const categories = operation.categoryIds.map((id) => dnsCategoryById.get(String(id))).filter(Boolean);
    const singleWork = stage.works.length === 1;
    const singleOperation = work.operations.length === 1;
    const crumbs = [{ name: "Каталог", kind: "home" }, { name: "Этапы работ", kind: "stages" }, { name: stage.name, kind: "stage", id: String(stage.id) }];
    let heading = operation.name;
    if (singleWork && singleOperation) {
      heading = stage.name;
    } else if (singleOperation) {
      crumbs.push({ name: work.name });
      heading = work.name;
    } else {
      if (!singleWork) crumbs.push({ name: work.name, kind: "work", id: String(stage.id), extra: String(workIndex) });
      crumbs.push({ name: operation.name });
    }
    return `${breadcrumbs(crumbs)}
      <section class="page-intro compact-intro"><h1>${escapeHtml(heading)}</h1></section>
      <section class="icon-card-grid">${categories.map(dnsCategoryIconCard).join("")}</section>`;
  }

  function renderStage() {
    const stage = visibleStages.find((item) => String(item.id) === state.id);
    if (!stage) return renderNotFound();
    const onlyWork = stage.works.length === 1 ? stage.works[0] : null;
    if (onlyWork?.operations.length === 1) return renderOperationPage(stage, 0, 0);
    const content = onlyWork
      ? `<section class="icon-card-grid">${onlyWork.operations.map((operation, operationIndex) => operationIconCard(stage, 0, operationIndex)).join("")}</section>`
      : `<section class="group-photo-grid stage-work-grid">${stage.works.map((work, workIndex) => {
          const target = workNavigation(stage, workIndex);
          const meta = work.operations.length === 1 ? `${work.operations[0].categoryIds.length} категорий` : `${work.operations.length} операций`;
          return catalogCard({ name: work.name, meta, image: WORK_IMAGES.get(work.name) || "", badge: `<b class="stage-badge">${workIndex + 1}</b>`, attrs: navAttrs(target.kind, target.id, target.extra) });
        }).join("")}</section>`;
    return `${breadcrumbs([{ name: "Каталог", kind: "home" }, { name: "Подбор по этапам работ", kind: "stages" }, { name: stage.name }])}
      <section class="page-intro"><h1>${escapeHtml(stage.name)}</h1></section>
      ${content}`;
  }

  function renderWork() {
    const stage = visibleStages.find((item) => String(item.id) === state.id);
    const workIndex = Number(state.extra);
    const work = stage?.works?.[workIndex];
    if (!stage || !work) return renderNotFound();
    if (work.operations.length === 1) return renderOperationPage(stage, workIndex, 0);
    return `${breadcrumbs([{ name: "Каталог", kind: "home" }, { name: "Этапы работ", kind: "stages" }, { name: stage.name, kind: "stage", id: String(stage.id) }, { name: work.name }])}
      <section class="page-intro compact-intro"><h1>${escapeHtml(work.name)}</h1></section>
      <section class="icon-card-grid">${work.operations.map((operation, operationIndex) => operationIconCard(stage, workIndex, operationIndex)).join("")}</section>`;
  }

  function renderOperation() {
    const stage = visibleStages.find((item) => String(item.id) === state.id);
    const [workIndex, operationIndex] = state.extra.split(":").map(Number);
    return renderOperationPage(stage, workIndex, operationIndex);
  }

  function renderNotFound() {
    return `${breadcrumbs([{ name: "Каталог", kind: "home" }, { name: "Раздел не найден" }])}<section class="page-intro"><h1>Раздел не найден</h1></section>`;
  }

  function renderPage() {
    const views = { home: renderHome, types: renderTypes, "type-node": renderTypeNode, macro: renderMacro, group: renderGroup, subgroup: renderSubgroup, "tax-category": renderTaxCategory, "virtual-category": renderVirtualCategory, platforms: renderPlatforms, brand: renderBrand, platform: renderPlatform, stages: renderStages, stage: renderStage, work: renderWork, operation: renderOperation };
    page.innerHTML = (views[state.kind] || renderNotFound)();
    document.title = `${page.querySelector("h1")?.textContent || "Каталог"} — DNS`;
  }

  function megaLevelItem({ name, meta, navKind, navId = "", navExtra = "", previewKind, previewId = "", previewExtra = "" }) {
    return `<button type="button" class="mega-level-item" ${navAttrs(navKind, navId, navExtra)} ${previewAttrs(previewKind, previewId, previewExtra)}><span><strong>${escapeHtml(name)}</strong>${meta ? `<small>${escapeHtml(meta)}</small>` : ""}</span><b aria-hidden="true">›</b></button>`;
  }

  function renderMegaCatalog() {
    return `<div class="mega-catalog-layout"><div class="mega-directory">
      <section class="mega-path-block"><button type="button" class="mega-path-title" ${navAttrs("platforms")}><span class="mega-path-number">01</span><span><strong>Аккумуляторные платформы</strong></span></button><div class="mega-level-list brands">${availableBrands.map((brand) => megaLevelItem({ name: brandSectionName(brand), meta: `${platformsForBrand(brand).length} платформ`, navKind: "brand", navId: brand.id, previewKind: "brand", previewId: brand.id })).join("")}</div></section>
      <section class="mega-path-block"><button type="button" class="mega-path-title" ${navAttrs("stages")}><span class="mega-path-number">02</span><span><strong>Подбор по этапам работ</strong></span></button><div class="mega-level-list stages">${visibleStages.map((stage) => megaLevelItem({ name: stage.name, meta: `${stage.categoryCount} категорий`, navKind: "stage", navId: String(stage.id), previewKind: "stage", previewId: String(stage.id) })).join("")}</div></section>
      <section class="mega-path-block"><button type="button" class="mega-path-title" ${navAttrs("types")}><span class="mega-path-number">03</span><span><strong>По типу инструмента</strong></span></button><div class="mega-level-list">${typeRoots.map((node) => megaLevelItem({ name: node.title, meta: typeNodeMeta(node), navKind: "type-node", navId: node.id, previewKind: "type-node", previewId: node.id })).join("")}</div></section>
    </div><aside id="mega-third-panel" class="mega-third-panel"><div class="mega-third-empty" aria-hidden="true"></div></aside></div>`;
  }

  function renderMegaPreview(kind, id) {
    if (kind === "brand") {
      const brand = BRAND_DEFS.find((item) => item.id === id);
      if (!brand) return "";
      const platforms = platformsForBrand(brand);
      return `<header><h3>${escapeHtml(brandSectionName(brand))}</h3></header><div class="mega-third-list">${platforms.map((platform) => `<button type="button" ${navAttrs("platform", brand.id, platform.name)}><span><strong>${escapeHtml(platform.name)}</strong><small>${flattenLeaves(platform).length} категорий</small></span><b>›</b></button>`).join("")}</div>`;
    }
    if (kind === "stage") {
      const stage = visibleStages.find((item) => String(item.id) === id);
      if (!stage) return "";
      const items = stage.works.length === 1
        ? stage.works[0].operations.map((operation, operationIndex) => ({ name: operation.name, meta: `${operation.categoryIds.length} категорий`, kind: "operation", extra: `0:${operationIndex}` }))
        : stage.works.map((work, workIndex) => {
            const target = workNavigation(stage, workIndex);
            return { name: work.name, meta: work.operations.length === 1 ? `${work.operations[0].categoryIds.length} категорий` : `${work.operations.length} операций`, kind: target.kind, extra: target.extra };
          });
      return `<header><h3>${escapeHtml(stage.name)}</h3></header><div class="mega-third-list">${items.map((item) => `<button type="button" ${navAttrs(item.kind, String(stage.id), item.extra)}><span><strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(item.meta)}</small></span><b>›</b></button>`).join("")}</div>`;
    }
    if (kind === "type-node") {
      const node = typeNodeById.get(id);
      if (!node) return "";
      const children = typeChildren(node.id);
      return `<header><h3>${escapeHtml(node.title)}</h3></header><div class="mega-third-list">${children.map((child) => `<button type="button" ${navAttrs("type-node", child.id)}><span><strong>${escapeHtml(child.title)}</strong><small>${escapeHtml(typeNodeMeta(child))}</small></span><b>›</b></button>`).join("")}</div>`;
    }
    return "";
  }

  function updateMegaPreview(element) {
    const panel = document.getElementById("mega-third-panel");
    if (!panel || !element) return;
    const kind = element.dataset.megaPreviewKind;
    const id = decodeURIComponent(element.dataset.megaPreviewId || "");
    const html = renderMegaPreview(kind, id);
    if (html) panel.innerHTML = html;
  }

  function openCatalog() {
    megaRoot.innerHTML = `<div class="mega-overlay" data-action="close-catalog"><section class="mega-panel"><aside><button type="button" class="active" ${navAttrs("home")}><span class="root-icon">⌂</span><strong>Ремонт и строительство</strong></button></aside><div class="mega-main"><header><div><h2>Ремонт и строительство</h2></div></header>${renderMegaCatalog()}</div></section></div>`;
    catalogToggle.classList.add("active");
    catalogToggle.setAttribute("aria-expanded", "true");
  }

  function closeCatalog() {
    megaRoot.innerHTML = "";
    catalogToggle.classList.remove("active");
    catalogToggle.setAttribute("aria-expanded", "false");
  }

  function renderTypeTree() {
    const branch = (node, open = false) => {
      const children = typeChildren(node.id);
      if (!children.length) return `<li><button type="button" ${navAttrs("type-node", node.id)}>${escapeHtml(node.title)}</button></li>`;
      const leavesOnly = children.every((child) => !typeChildren(child.id).length);
      const body = leavesOnly
        ? `<ul>${children.map((child) => branch(child)).join("")}</ul>`
        : `<div>${children.map((child) => branch(child)).join("")}</div>`;
      return `<details${open ? " open" : ""}><summary><strong>${escapeHtml(node.title)}</strong><small>${escapeHtml(typeNodeMeta(node))}</small></summary>${body}</details>`;
    };
    return typeRoots.map((node) => branch(node, true)).join("");
  }

  function renderTree() {
    const platformTree = availableBrands.map((brand) => `<details><summary><strong>${escapeHtml(brandSectionName(brand))}</strong><small>${platformsForBrand(brand).length} платформ</small></summary><ul>${platformsForBrand(brand).map((platform) => `<li><button type="button" ${navAttrs("platform", brand.id, platform.name)}>${escapeHtml(platform.name)}</button></li>`).join("")}</ul></details>`).join("");
    const stageTree = visibleStages.map((stage) => `<details><summary><strong>${escapeHtml(stage.name)}</strong><small>${stage.works.length} видов работ</small></summary><div>${stage.works.map((work, workIndex) => work.operations.length === 1
      ? `<ul><li><button type="button" ${navAttrs("operation", String(stage.id), `${workIndex}:0`)}>${escapeHtml(work.name)}</button><span>${work.operations[0].categoryIds.length}</span></li></ul>`
      : `<details><summary><strong>${escapeHtml(work.name)}</strong><small>${work.operations.length} операций</small></summary><ul>${work.operations.map((operation, operationIndex) => `<li><button type="button" ${navAttrs("operation", String(stage.id), `${workIndex}:${operationIndex}`)}>${escapeHtml(operation.name)}</button></li>`).join("")}</ul></details>`).join("")}</div></details>`).join("");
    modalRoot.innerHTML = `<div class="tree-overlay" data-action="close-tree"><aside class="tree-panel"><header><div><h2>Дерево каталога</h2></div><button type="button" data-action="close-tree" aria-label="Закрыть">×</button></header><div class="tree-content"><details open><summary><strong>Аккумуляторные платформы</strong><small>${availableBrands.length} брендов</small></summary><div>${platformTree}</div></details><details open><summary><strong>Подбор по этапам работ</strong><small>${visibleStages.length} этапов</small></summary><div>${stageTree}</div></details><details open><summary><strong>По типу инструмента</strong><small>${typeRoots.length} разделов</small></summary><div>${renderTypeTree()}</div></details></div></aside></div>`;
  }

  const searchItems = [
    ...typeNodes.map((item) => ({ name: item.title, caption: item.kind === "Товарная категория" ? "Категория по типу" : "Раздел по типу", kind: "type-node", id: item.id })),
    ...availableBrands.map((item) => ({ name: brandSectionName(item), caption: "Аккумуляторные платформы", kind: "brand", id: item.id })),
    ...visibleStages.map((item) => ({ name: item.name, caption: "Этап работ", kind: "stage", id: String(item.id) })),
    ...FULL.categories.map((item) => ({ name: item.name, caption: "Категория DNS", url: item.url })),
  ];

  function updateSearch() {
    const term = normalize(searchInput.value);
    if (term.length < 2) { searchResults.hidden = true; return; }
    const matches = searchItems.filter((item) => normalize(item.name).includes(term)).slice(0, 14);
    searchResults.innerHTML = matches.length ? matches.map((item) => item.url
      ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener"><strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(item.caption)}</small></a>`
      : `<button type="button" ${navAttrs(item.kind, item.id)}><strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(item.caption)}</small></button>`).join("") : "<p>Совпадений нет</p>";
    searchResults.hidden = false;
  }

  root.addEventListener("click", (event) => {
    const nav = event.target.closest("[data-nav-kind]");
    if (nav) {
      navigate(nav.dataset.navKind, decodeURIComponent(nav.dataset.navId || ""), decodeURIComponent(nav.dataset.navExtra || ""));
      modalRoot.innerHTML = "";
      return;
    }
    const action = event.target.closest("[data-action]");
    if (!action) return;
    if (action.dataset.action === "toggle-catalog") megaRoot.innerHTML ? closeCatalog() : openCatalog();
    if (action.dataset.action === "close-catalog" && action === event.target) closeCatalog();
    if (action.dataset.action === "open-tree") { closeCatalog(); renderTree(); }
    if (action.dataset.action === "close-tree" && (action === event.target || action.tagName === "BUTTON")) modalRoot.innerHTML = "";
  });

  root.addEventListener("mouseover", (event) => updateMegaPreview(event.target.closest("[data-mega-preview-kind]")));
  root.addEventListener("focusin", (event) => updateMegaPreview(event.target.closest("[data-mega-preview-kind]")));
  searchInput.addEventListener("input", updateSearch);
  searchInput.addEventListener("focus", updateSearch);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") { closeCatalog(); modalRoot.innerHTML = ""; searchResults.hidden = true; }
  });

  renderPage();
  if (window.__DNS_OPEN_CATALOG_ON_READY__) {
    window.__DNS_OPEN_CATALOG_ON_READY__ = false;
    openCatalog();
  }
  if (window.__DNS_OPEN_TREE_ON_READY__) {
    window.__DNS_OPEN_TREE_ON_READY__ = false;
    renderTree();
  }
  window.__DNS_APP_READY__ = true;
  window.dispatchEvent(new Event("dns-app-ready"));
})();
</script>
</body>
</html>
